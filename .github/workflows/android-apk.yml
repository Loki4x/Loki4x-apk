name: Build Android APK

# Build APK otomatis:
# - Setiap pull request: dicek & di-build, APK tersedia di tab "Artifacts" run tersebut.
# - Setiap push ke main: APK juga diterbitkan di halaman Releases (gampang diunduh dari HP).
#
# Wajib diisi sekali di GitHub: Settings → Secrets and variables → Actions → tab "Variables":
#   EXPO_PUBLIC_SUPABASE_URL       = NEXT_PUBLIC_SUPABASE_URL dari project web (Vercel)
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  = NEXT_PUBLIC_SUPABASE_ANON_KEY dari project web (Vercel)
#   EXPO_PUBLIC_WEB_URL            = (opsional) default https://www.loki4xacademy.web.id
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID = (opsional) Client ID Google di Supabase → login Google pakai popup akun Android
#
# Opsional untuk push notification (tab "Secrets"):
#   GOOGLE_SERVICES_JSON           = isi file google-services.json dari Firebase (boleh JSON mentah atau base64)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL || 'https://www.loki4xacademy.web.id' }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Cek konfigurasi
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Variable EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY belum diisi (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Firebase config (push notification)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON belum diisi: APK tetap dibuat, tapi push notification nonaktif."
            exit 0
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          fi
          node -e "const j=require('./google-services.json');const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==='id.web.loki4xacademy.app');if(!ok){console.error('::error::google-services.json tidak berisi aplikasi Android id.web.loki4xacademy.app. Tambahkan aplikasi dengan package name itu di Firebase.');process.exit(1)}console.log('google-services.json OK, project',j.project_info.project_id)"

      # Nomor build Android (versionCode) = nomor run GitHub Actions, selalu naik di setiap build.
      # Aplikasi membandingkan angka ini dengan latest.json untuk tahu ada update atau tidak.
      # Nama versi (mis. 1.0.1) diambil dari app.json → expo.version: naikkan di setiap PR.
      - name: Set nomor versi
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.android.versionCode=Number(process.env.RUN);require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          echo "Versi $(node -p "require('./app.json').expo.version") · build ${RUN}"
        env:
          RUN: ${{ github.run_number }}

      - name: Cek versi sudah dinaikkan (PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}" || exit 0
          BASE=$(git show "origin/${{ github.base_ref }}:app.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).expo.version))")
          HEAD=$(node -p "require('./app.json').expo.version")
          if [ "$BASE" = "$HEAD" ]; then
            echo "::warning::Versi aplikasi masih $HEAD (sama dengan main). Naikkan expo.version di app.json supaya user melihat nomor versi baru."
          else
            echo "Versi naik: $BASE → $HEAD"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Cache unduhan Gradle antar build (lebih cepat & lebih sedikit request ke Maven Central).
      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK (release)
        working-directory: android
        # Init script: pakai mirror Google untuk Maven Central (hindari HTTP 429 / "Could not find").
        run: ./gradlew --init-script ../gradle/maven-mirror.init.gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "APK_NAME=loki4x-academy-v${VERSION}-build${{ github.run_number }}.apk" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "loki4x-academy-v${VERSION}-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: loki4x-academy-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          # Catatan rilis: judul PR yang di-merge (baris pertama isi commit merge), atau judul commit.
          NOTES=$(git log -1 --pretty=%b | sed '/^\s*$/d' | head -1)
          [ -z "$NOTES" ] && NOTES=$(git log -1 --pretty=%s)
          export VERSION NOTES
          # latest.json dibaca aplikasi saat dibuka untuk menampilkan banner update.
          node -e "require('fs').writeFileSync('latest.json', JSON.stringify({version:process.env.VERSION,versionCode:Number(process.env.RUN),apkUrl:'https://github.com/'+process.env.REPO+'/releases/download/build-'+process.env.RUN+'/'+process.env.APK_NAME,notes:process.env.NOTES,publishedAt:new Date().toISOString()},null,2))"
          cat latest.json
          gh release create "build-${RUN}" "$APK_NAME" latest.json \
            --title "Loki4x Academy v${VERSION} (build ${RUN})" \
            --notes "${NOTES}

          APK otomatis dari commit ${GITHUB_SHA::7}. Unduh file .apk di bawah lalu install di HP Android." \
            --latest
        shell: bash
